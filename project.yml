name: DonDep
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  DonDep:
    type: application
    platform: iOS
    sources:
      - path: DonDep
    info:
      path: DonDep/Info.plist
      properties:
        CFBundleDisplayName: "Dọn Dẹp"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryUsageDescription: "Ứng dụng cần truy cập Thư viện ảnh để tìm ảnh trùng lặp, ảnh mờ, ảnh Live và video lớn giúp bạn giải phóng dung lượng. Mọi phân tích diễn ra ngay trên máy."
        NSPhotoLibraryAddUsageDescription: "Ứng dụng cần lưu ảnh/video đã chuyển đổi hoặc nén vào Thư viện ảnh."
        NSContactsUsageDescription: "Ứng dụng cần truy cập Danh bạ để tìm và gộp các liên hệ trùng lặp."
        NSCalendarsFullAccessUsageDescription: "Ứng dụng cần truy cập Lịch để tìm và xóa các sự kiện cũ."
        NSCalendarsUsageDescription: "Ứng dụng cần truy cập Lịch để tìm và xóa các sự kiện cũ."
        NSFaceIDUsageDescription: "Dùng Face ID để khóa Kho ảnh bí mật."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.dondep
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: "NO"
schemes:
  DonDep:
    build:
      targets:
        DonDep: all
